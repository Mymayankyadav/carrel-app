name: R5 Android QA (unsigned)
on:
  pull_request:
    paths:
      - 'android/**'
      - 'web/native.js'
      - 'web/test/native_redesign_test.js'
      - 'tools/patch_android.py'
      - '.github/workflows/android-r5-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate native Settings bridge
        run: node web/test/native_redesign_test.js
      - name: Build web bundle
        run: npm run build:web
      - name: Sync native project
        run: |
          npx cap sync android
          python3 tools/patch_android.py
      - name: Verify native model and debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Upload unsigned-release-independent debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Carrel-R5-QA-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
