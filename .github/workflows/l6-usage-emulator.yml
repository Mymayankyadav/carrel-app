name: L6 Android Usage Access emulator
on:
  pull_request:
    paths:
      - 'android/**'
      - 'web/ui/distraction.js'
      - 'web/native.js'
      - '.github/workflows/l6-usage-emulator.yml'
  workflow_dispatch:
concurrency:
  group: l6-usage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  usage-access-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-audit --no-fund
      - name: Build web assets and sync Capacitor
        run: |
          npm run build:web
          npx cap sync android
          python3 tools/patch_android.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise Android Usage Access grant, deny, and allowlist
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          # The emulator action invokes each script line in its own shell:
          # use one command so the working-directory change is preserved.
          script: chmod +x android/gradlew && (cd android && ./gradlew --no-daemon :app:connectedDebugAndroidTest --stacktrace)
      - name: Preserve Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l6-usage-emulator-report
          path: |
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 14
