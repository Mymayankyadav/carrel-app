name: Web (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ['web/**', 'package.json', 'package-lock.json', '.github/workflows/web.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - run: npm run build:web

      - name: Tests
        run: |
          for f in web/test/*_test.js; do
            TZ=Asia/Kolkata node "$f" || exit 1
          done
      - name: Publish the web bundle for in-app updates
        env: { RUN: '${{ github.run_number }}', OWNER: '${{ github.repository_owner }}', REPO: '${{ github.event.repository.name }}' }
        run: |
          V="1.0.$RUN"
          NATIVE=$(sed -n 's/^const NATIVE_API = \([0-9]*\).*/\1/p' web/config.js)
          (cd www && zip -qr "../web-$V.zip" . -x 'updates/*')
          mkdir -p www/updates && mv "web-$V.zip" www/updates/
          SUM=$(sha256sum "www/updates/web-$V.zip" | cut -d' ' -f1)   # the updater refuses bundles without a SHA-256 checksum
          printf '{"version":"%s","url":"https://%s.github.io/%s/updates/web-%s.zip","checksum":"%s","minNative":%s}\n' "$V" "${OWNER,,}" "$REPO" "$V" "$SUM" "$NATIVE" > www/updates/latest.json
          cat www/updates/latest.json; unzip -l "www/updates/web-$V.zip" | grep -E ' index.html$'
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: deployment
        uses: actions/deploy-pages@v4
