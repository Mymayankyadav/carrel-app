name: Web (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ['web/**', 'package.json', 'package-lock.json', '.github/workflows/web.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - run: npm run build:web
      - name: Tests
        run: |
          TZ=Asia/Kolkata node web/test/logic_test.js
          node web/test/supa_test.js
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: deployment
        uses: actions/deploy-pages@v4
