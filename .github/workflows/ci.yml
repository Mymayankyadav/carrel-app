name: CI (web build and tests)
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci --no-audit --no-fund
      - run: python3 -m pip install playwright==1.56.0
      - name: Select browser
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$CHROME" ]; then
            echo "CARREL_CHROMIUM=$CHROME" >> "$GITHUB_ENV"
          else
            python3 -m playwright install chromium
          fi
      - run: npm run build:web
      - name: JavaScript tests
        run: |
          for f in web/test/*_test.js; do
            TZ=Asia/Kolkata node "$f" || exit 1
          done
      - name: V2 smoke checks
        run: |
          for f in tools/v2_*_smoke.py; do
            [ -e "$f" ] && python3 "$f"
          done
      - name: Preserve screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-f1-shots
          path: v2-shots/
          if-no-files-found: ignore
