name: Scaffold Android (run once)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - run: npm install --no-audit --no-fund @capacitor/core @capacitor/android @capacitor/app @capacitor/browser @capacitor/filesystem @capacitor/share
      - run: npm install --no-audit --no-fund -D @capacitor/cli
      - run: npm run build:web
      - run: npx cap add android
      - run: python3 tools/patch_android.py
      - name: Record versions
        run: |
          node -e "const p=require('./package.json');console.log(JSON.stringify(p.dependencies,null,1),JSON.stringify(p.devDependencies))"
          ls android android/app
      - name: Commit the Android project
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json android
          git commit -m "Scaffold Capacitor Android project" || echo "nothing to commit"
          git push
