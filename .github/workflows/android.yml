name: Android APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install --no-audit --no-fund
      - name: Tests and web build
        run: |
          TZ=Asia/Kolkata node web/test/logic_test.js
          node web/test/supa_test.js
          CARREL_BUNDLE_FONTS=1 npm run build:web
      - run: npx cap sync android
      - run: python3 tools/patch_android.py
      - name: Version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "VERSION_CODE=$((100000 + RUN_NUMBER))" >> "$GITHUB_ENV"
          if [[ "$REF_TYPE" == tag && "$REF_NAME" == v* ]]; then
            echo "VERSION_NAME=${REF_NAME#v}" >> "$GITHUB_ENV"; echo "RELEASE_TAG=$REF_NAME" >> "$GITHUB_ENV"; echo "PRERELEASE=false" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=1.0.0-dev.$RUN_NUMBER" >> "$GITHUB_ENV"; echo "RELEASE_TAG=build-$RUN_NUMBER" >> "$GITHUB_ENV"; echo "PRERELEASE=true" >> "$GITHUB_ENV"
          fi
      - name: Restore release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Missing signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD).'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/carrel-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/carrel-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon assembleRelease > "$RUNNER_TEMP/gradle.log" 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -nE "^e: |error:|What went wrong|Execution failed|Could not |Unresolved|AAPT|FAILURE" -A2 "$RUNNER_TEMP/gradle.log" | head -45 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$msg"
          fi
          exit $code
      - name: Verify signature
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          mkdir -p dist && cp "$APK" dist/Carrel.apk
          (cd dist && sha256sum Carrel.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Carrel-${{ env.RELEASE_TAG }}
          path: dist/*
          if-no-files-found: error
      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$PRERELEASE" == true ]]; then gh release create "$RELEASE_TAG" --target "$COMMIT" --title "Carrel $VERSION_NAME" --generate-notes --prerelease
            else gh release create "$RELEASE_TAG" --target "$COMMIT" --title "Carrel $VERSION_NAME" --generate-notes; fi
          fi
          gh release upload "$RELEASE_TAG" dist/Carrel.apk dist/SHA256SUMS.txt --clobber
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/carrel-release.jks"
