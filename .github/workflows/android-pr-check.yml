name: Android checks (unsigned)
on:
  pull_request:
    paths:
      - 'android/**'
      - 'web/native.js'
      - 'tools/patch_android.py'
      - '.github/workflows/android-pr-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Build web bundle
        run: npm run build:web
      - name: Sync Capacitor and apply native patches
        run: |
          npx cap sync android
          python3 tools/patch_android.py
      - name: Run JVM tests and build unsigned-release-independent debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Carrel-redesign-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
